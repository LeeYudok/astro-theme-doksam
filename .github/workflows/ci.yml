name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir demo install --frozen-lockfile
      - name: Build demo
        run: pnpm --dir demo build
      - name: No external resources
        run: node scripts/check-external.mjs demo/dist https://example.com
